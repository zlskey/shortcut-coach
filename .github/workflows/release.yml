name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: echo "value=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ARCHS="arm64 x86_64" VERSION="${VERSION#v}" ./build.sh

      - name: Zip the app
        run: ditto -c -k --keepParent build/ShortcutCoach.app ShortcutCoach.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cat > notes.md <<'EOF'
          Download `ShortcutCoach.zip`, unzip it, and move **ShortcutCoach.app** to your Applications folder.

          The build is ad-hoc signed and not notarized, so macOS quarantines it on download. Clear that once:

          ```bash
          xattr -dr com.apple.quarantine /Applications/ShortcutCoach.app
          ```

          Then launch it and grant **System Settings ▸ Privacy & Security ▸ Accessibility**.
          EOF
          gh release create "$VERSION" ShortcutCoach.zip \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
