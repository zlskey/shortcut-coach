name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole tag history, to work out what comes next

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
            echo "Latest release is $latest; bumping $BUMP to $tag"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"
              exit 1
            fi
          else
            tag="$REF_NAME"
            echo "Releasing tag $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Tag it
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"   # pushed with GITHUB_TOKEN, so this does not retrigger the workflow

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: ARCHS="arm64 x86_64" ./build.sh

      - name: Zip the app
        run: ditto -c -k --keepParent build/ShortcutCoach.app ShortcutCoach.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Download `ShortcutCoach.zip`, unzip it, and move **ShortcutCoach.app** to your Applications folder.

          The build is ad-hoc signed and not notarized, so macOS quarantines it on download. Clear that once:

          ```bash
          xattr -dr com.apple.quarantine /Applications/ShortcutCoach.app
          ```

          Then launch it and grant **System Settings ▸ Privacy & Security ▸ Accessibility**.
          EOF
          gh release create "$TAG" ShortcutCoach.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes
