name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Set all five secrets to get signed, notarized builds that download without a
      # Gatekeeper warning. Without them the release is ad-hoc signed and users have to
      # clear the quarantine flag by hand.
      SIGNED: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' && secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole tag history, to work out what comes next

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
            echo "Latest release is $latest; bumping $BUMP to $tag"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"
              exit 1
            fi
          else
            tag="$REF_NAME"
            echo "Releasing tag $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Tag it
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"   # pushed with GITHUB_TOKEN, so this does not retrigger the workflow

      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -z "$identity" ] && { echo "::error::no Developer ID Application identity in the imported certificate"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: ARCHS="arm64 x86_64" ./build.sh

      - name: Notarize and staple
        if: env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/ShortcutCoach.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple build/ShortcutCoach.app
          spctl --assess --type execute --verbose build/ShortcutCoach.app

      - name: Zip the app
        run: ditto -c -k --keepParent build/ShortcutCoach.app ShortcutCoach.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Download `ShortcutCoach.zip`, unzip it, and move **ShortcutCoach.app** to your Applications folder.
          Then launch it and grant **System Settings ▸ Privacy & Security ▸ Accessibility**.
          EOF
          if [ "$SIGNED" != "true" ]; then
            cat >> notes.md <<'EOF'

          This build is ad-hoc signed and not notarized, so macOS refuses to open it at first
          ("Apple could not verify…"). Either clear the quarantine flag:

          ```bash
          xattr -dr com.apple.quarantine /Applications/ShortcutCoach.app
          ```

          or open **System Settings ▸ Privacy & Security**, scroll down, and click **Open Anyway**.
          EOF
          fi
          gh release create "$TAG" ShortcutCoach.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes
